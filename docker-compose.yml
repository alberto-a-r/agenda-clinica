services:
  db:
    # PostgreSQL 17 con la extensión pgvector para la búsqueda semántica
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    ports:
      - "5433:5432"
    volumes:
      # Los scripts de esta carpeta se ejecutan solo la primera vez que se crea el volumen
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
